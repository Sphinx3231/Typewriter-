<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Target page</title>
    <style>
      body { margin: 16px; font: 15px/1.5 system-ui, sans-serif; }
      textarea, input, [contenteditable] { display: block; width: 90%; margin: 8px 0; font: 15px/1.5 monospace; }
      textarea { height: 160px; white-space: pre-wrap; }
      [contenteditable] { min-height: 60px; outline: 1px solid #ccc; padding: 4px; }
    </style>
  </head>
  <body>
    <textarea id="ta" spellcheck="false"></textarea>
    <input id="single" type="text" spellcheck="false" />
    <div id="ce" contenteditable="true" spellcheck="false"></div>
    <textarea id="other" spellcheck="false"></textarea>
    <input id="pw" type="password" />
    <input id="otp" type="text" autocomplete="one-time-code" />
    <button id="btn">Not a field</button>
    <script>
      // Count every key the page receives, to prove nothing arrives unexpectedly.
      window.keys = 0;
      addEventListener("keydown", () => window.keys++, true);
      addEventListener("beforeinput", (e) => { if (e.inputType === "insertText" && !e.isTrusted) window.untrusted = (window.untrusted || 0) + 1; }, true);
    </script>
  </body>
</html>
