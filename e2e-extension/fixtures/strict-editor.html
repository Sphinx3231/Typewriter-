<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strict editor (Docs-like stand-in)</title>
    <style>
      body { margin: 0; font: 15px system-ui, sans-serif; }
      canvas { display: block; margin: 16px; border: 1px solid #ccc; cursor: text; }
      .texteventtarget { position: absolute; left: -10000px; top: 0; width: 1px; height: 1px; border: 0; }
    </style>
  </head>
  <body>
    <canvas id="page" width="900" height="420"></canvas>
    <script>
      // A stand-in for how Google Docs takes input: keys go to a contenteditable inside a
      // hidden iframe, the text lives in a JavaScript model (never in the DOM) and is
      // drawn on a canvas, and untrusted (script-made) events are ignored.
      // It is NOT Google Docs; it only reproduces those properties for testing.
      const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
      const model = { cells: [], caret: 0, rejected: 0 };
      window.model = model;
      window.modelText = () => model.cells.join("");
      const frame = document.createElement("iframe");
      frame.className = "texteventtarget";
      document.body.appendChild(frame);
      const doc = frame.contentDocument;
      doc.open();
      doc.write("<!doctype html><html><body contenteditable='true' spellcheck='false'></body></html>");
      doc.close();
      const canvas = document.getElementById("page");
      canvas.addEventListener("mousedown", (e) => { e.preventDefault(); doc.body.focus(); });
      const draw = () => {
        const g = canvas.getContext("2d");
        g.clearRect(0, 0, canvas.width, canvas.height);
        g.font = "16px monospace";
        g.fillStyle = "#111";
        model.cells.join("").split("\n").forEach((line, i) => g.fillText(line.replace(/\t/g, "    "), 12, 28 + i * 22));
      };
      const insert = (s) => {
        const parts = Array.from(seg.segment(s), (x) => x.segment);
        model.cells.splice(model.caret, 0, ...parts);
        model.caret += parts.length;
      };
      doc.addEventListener("keydown", (e) => {
        if (!e.isTrusted) { model.rejected++; e.preventDefault(); return; }
        if (e.key === "Backspace") { if (model.caret > 0) model.cells.splice(--model.caret, 1); }
        else if (e.key === "ArrowLeft") model.caret = Math.max(0, model.caret - 1);
        else if (e.key === "ArrowRight") model.caret = Math.min(model.cells.length, model.caret + 1);
        else if (e.key === "Enter") insert("\n");
        // Like Google Docs, a Tab key press inserts a tab instead of moving focus.
        else if (e.key === "Tab" && !e.shiftKey) insert("\t");
        else return;
        e.preventDefault();
        draw();
      }, true);
      doc.addEventListener("beforeinput", (e) => {
        e.preventDefault();
        if (!e.isTrusted) { model.rejected++; return; }
        if ((e.inputType === "insertText" || e.inputType === "insertCompositionText" || e.inputType === "insertReplacementText") && e.data) insert(e.data);
        draw();
      }, true);
      // Text pasted or inserted any other way never reaches the model.
      doc.addEventListener("input", () => { doc.body.textContent = ""; }, true);
      draw();
    </script>
  </body>
</html>
