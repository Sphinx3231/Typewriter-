[package]
name = "typewriter-native"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Native keyboard output for Typewriter: turns a typing timeline into real key events, with safety guards."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6.1"
active-win-pos-rs = "0.11.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
serde_json = "1"
