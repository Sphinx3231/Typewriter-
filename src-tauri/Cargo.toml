[package]
name = "typewriter"
version = "1.1.0"
description = "Typewriter types your text out naturally, like a real person."
edition = "2021"
license = "MIT"

[lib]
name = "typewriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }
typewriter-native = { path = "native" }

[workspace]
members = [".", "native"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
