[package]
name = "typewriter"
version = "1.2.0"
description = "Typewriter types your text out naturally, like a real person."
edition = "2021"
license = "MIT"

[lib]
name = "typewriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }
typewriter-native = { path = "native" }

[target.'cfg(windows)'.dependencies]
# The same versions Tauri's webview layer (wry) uses: the exit waits for WebView2 to save storage.
webview2-com = "0.39"
windows-core = "0.62"

[workspace]
members = [".", "native"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
