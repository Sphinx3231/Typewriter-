<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plain text field</title>
    <style>
      body { margin: 16px; font: 15px system-ui, sans-serif; }
      textarea { width: 860px; height: 380px; font: 16px monospace; }
    </style>
  </head>
  <body>
    <textarea id="t" spellcheck="false"></textarea>
    <script>
      // textarea.html#Essay is titled "Essay - Plain text field", so tabs can be told apart.
      if (location.hash) document.title = decodeURIComponent(location.hash.slice(1)) + " - Plain text field";
    </script>
  </body>
</html>
