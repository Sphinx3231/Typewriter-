name: Desktop builds

# Builds installers on GitHub's free hosted runners. Runs on pushes to main,
# on pull requests that touch the desktop code, and on demand
# (Actions tab → Desktop builds → Run workflow).
on:
  push:
    branches: [main]
  pull_request:
    paths: ["src-tauri/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub pre-release with these installers (only if every build and the Windows end-to-end test pass)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
            # One installer only: the per-user setup.exe. Shipping an MSI as well (it installs
            # to Program Files) let two copies sit side by side, and the Start menu could open
            # the older one.
            bundles: --bundles nsis
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf
      - run: npm ci
      - name: Native typing tests
        run: cargo test --manifest-path src-tauri/native/Cargo.toml --test session
      - name: Build installers
        run: npx tauri build ${{ matrix.bundles }}
      - name: Installer checksums (SHA-256 of the files uploaded below)
        shell: bash
        run: >-
          node -e "const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const root = 'src-tauri/target/release/bundle';
          for (const d of fs.readdirSync(root)) for (const f of fs.readdirSync(path.join(root, d)))
          if (/\\.(deb|rpm|AppImage|dmg)$|-setup\\.exe$/.test(f)) { const p = path.join(root, d, f);
          console.log(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'), fs.statSync(p).size, p); }"
      - uses: actions/upload-artifact@v4
        with:
          name: typewriter-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn

  # The real app on a real Windows desktop: typing into a native Windows text box with
  # real key events, the status window, pause/resume, focus loss and the emergency stop.
  # Windows Server 2022: on the 2025 image (windows-latest) Microsoft Edge WebDriver can't
  # start any WebView2 app (actions/runner-images#14738), so no session is ever created.
  # It installs the very setup.exe the build job uploaded (the file users download), first as an
  # upgrade over the published v1.2.0 pre-release.
  windows-e2e:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: The setup.exe from the build job (the downloadable file)
        uses: actions/download-artifact@v4
        with:
          name: typewriter-windows
          path: installer
      - name: Install tauri-driver and a matching msedgedriver
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Install the published v1.2.0 first (the version users have now) and save settings in it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.0 --repo "$env:GITHUB_REPOSITORY" --pattern '*-setup.exe' --dir previous
          $old = Get-ChildItem previous/*-setup.exe | Select-Object -First 1
          "previous installer: $($old.Name) sha256 $((Get-FileHash $old.FullName -Algorithm SHA256).Hash)"
          Start-Process $old.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Typewriter" -Recurse -Filter typewriter.exe | Select-Object -First 1
          if (-not $exe) { throw "the previous version's typewriter.exe wasn't found" }
          "previous version installed: $($exe.FullName) $($exe.VersionInfo.FileVersion) $($exe.LastWriteTime)"
          # v1.2.0 loses settings changed in about the last minute before closing (fixed in this
          # build): WebView2 holds a page-storage write for up to a minute after the previous one
          # and only writes it out when its browser process shuts down cleanly, which v1.2.0 did
          # not wait for. Run 38 lost them even 10 s after the change. So the old version gets
          # 70 s; the control below then shows they were really on disk before the upgrade.
          $env:SETTLE_MS = "70000"
          node e2e-desktop/upgrade.mjs before $exe.FullName upgrade-state.json
          if ($LASTEXITCODE -ne 0) { throw "could not save settings in the previous version" }
          $env:SETTLE_MS = ""
          # Control: the previous version, reopened, really kept them (so a loss below is the upgrade's).
          node e2e-desktop/upgrade.mjs check $exe.FullName upgrade-state.json
          if ($LASTEXITCODE -ne 0) { throw "the previous version itself did not keep the settings" }
      - name: Install the new setup.exe silently over it and find it
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "the build job uploaded no setup.exe" }
          "installer: $($setup.Name) $($setup.Length) bytes sha256 $((Get-FileHash $setup.FullName -Algorithm SHA256).Hash)"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Typewriter", "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles\Typewriter" -Recurse -Filter typewriter.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "the installed typewriter.exe wasn't found" }
          "installed: $($exe.FullName) $($exe.LastWriteTime)"
          "TW_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: The settings saved in v1.2.0 survived the upgrade
        run: node e2e-desktop/upgrade.mjs after "$env:TW_EXE" upgrade-state.json
      - name: Settings changed just before closing are kept (the new app is closed at once, then reopened)
        run: |
          node e2e-desktop/upgrade.mjs before "$env:TW_EXE" close-state.json
          if ($LASTEXITCODE -ne 0) { throw "could not change settings in the new version" }
          node e2e-desktop/upgrade.mjs check "$env:TW_EXE" close-state.json
          if ($LASTEXITCODE -ne 0) { throw "settings changed just before closing were lost" }
      - name: Build the Chrome extension (for the Opera check)
        run: npx vite build -c vite.extension.config.ts
      - name: Install Opera (best effort; Chrome and Edge are preinstalled)
        continue-on-error: true
        run: choco install opera -y --no-progress
      - name: Windows end-to-end (the installed app)
        env:
          SHOTS: e2e-shots
          EXPECT_COMMIT: ${{ github.sha }}
        run: node e2e-desktop/windows.mjs "$env:TW_EXE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-screenshots
          path: e2e-shots
          if-no-files-found: warn

  # Run workflow with "release" ticked: once the installers are built and the installed
  # Windows app has passed its end-to-end test on this same commit, publish them as a
  # pre-release ("v<version>" from package.json), so they can be downloaded from the
  # Releases page without signing in. Re-running it replaces that release's files.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [build, windows-e2e]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: typewriter-*
          path: artifacts
      - name: Collect the installers and their checksums
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls dist/*-setup.exe dist/*.dmg dist/*.deb > /dev/null
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          notes="docs/RELEASE-$VERSION.md"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --prerelease --title "Typewriter $VERSION" --notes-file "$notes"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --prerelease --target "$GITHUB_SHA" --title "Typewriter $VERSION" --notes-file "$notes"
          fi
          echo "Release: $(gh release view "$tag" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
