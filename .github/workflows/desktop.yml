name: Desktop builds

# Builds installers on GitHub's free hosted runners. Runs on pushes to main,
# on pull requests that touch the desktop code, and on demand
# (Actions tab → Desktop builds → Run workflow).
on:
  push:
    branches: [main]
  pull_request:
    paths: ["src-tauri/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf
      - run: npm ci
      - name: Native typing tests
        run: cargo test --manifest-path src-tauri/native/Cargo.toml --test session
      - name: Build installers
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: typewriter-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn

  # The real app on a real Windows desktop: typing into a native Windows text box with
  # real key events, the status window, pause/resume, focus loss and the emergency stop.
  # Windows Server 2022: on the 2025 image (windows-latest) Microsoft Edge WebDriver can't
  # start any WebView2 app (actions/runner-images#14738), so no session is ever created.
  windows-e2e:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the app
        run: npx tauri build --no-bundle
      - name: Install tauri-driver and a matching msedgedriver
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Install Opera (best effort; Chrome and Edge are preinstalled)
        continue-on-error: true
        run: choco install opera -y --no-progress
      - name: Windows end-to-end
        env:
          SHOTS: e2e-shots
        run: node e2e-desktop/windows.mjs src-tauri/target/release/typewriter.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-screenshots
          path: e2e-shots
          if-no-files-found: warn
